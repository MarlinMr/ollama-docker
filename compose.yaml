services:
  registry:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports:
      - "${REGISTRY_BIND:-127.0.0.1}:${REGISTRY_PORT:-5000}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${MODEL_STORAGE:-./models}:/models:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    networks:
      - registry

  admin:
    image: ollama/ollama:0.40.12
    profiles: [admin]
    command: serve
    environment:
      OLLAMA_MODELS: /models
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ${MODEL_STORAGE:-./models}:/models
      - admin-state:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 2s
      timeout: 5s
      retries: 30

networks:
  registry: {}

volumes:
  admin-state:
