worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    sendfile on;
    default_type application/octet-stream;

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        autoindex off;
        add_header Docker-Distribution-Api-Version registry/2.0 always;

        # No writes, including on the redirect endpoints.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location = /v2/ {
            default_type application/json;
            return 200 '{}';
        }

        # Serve only models explicitly pulled from the public Ollama registry.
        location ~ "^/v2/([a-z0-9][a-z0-9_-]*)/([a-z0-9][a-z0-9._-]*)/manifests/([a-zA-Z0-9_][a-zA-Z0-9_.-]*)$" {
            alias /models/manifests/registry.ollama.ai/$1/$2/$3;
            default_type application/vnd.docker.distribution.manifest.v2+json;
        }

        # HEAD needs the actual blob size. GET redirects to a local download
        # URL for Ollama versions that discover a URL before ranged downloads.
        location ~ "^/v2/([a-z0-9][a-z0-9_-]*)/([a-z0-9][a-z0-9._-]*)/blobs/sha256:([a-f0-9]{64})$" {
            set $blob /models/blobs/sha256-$3;
            if (!-f $blob) {
                return 404;
            }
            if ($request_method = GET) {
                return 307 /objects/sha256-$3;
            }
            alias /models/blobs/sha256-$3;
        }

        # Nginx provides Content-Length, HEAD, and HTTP Range support.
        location ~ "^/objects/sha256-([a-f0-9]{64})$" {
            alias /models/blobs/sha256-$1;
            # Newer Ollama follows same-origin redirects during discovery,
            # then reads Location even on the final 200 response.
            add_header Location /objects/sha256-$1 always;
        }

        location / {
            return 404;
        }
    }
}
